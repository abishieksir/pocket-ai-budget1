<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket AI - NextGen Budget Assistant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Font: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #090d16;
        }
        .glass-card {
            background: rgba(18, 24, 38, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card-glow {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.15);
        }
        .ai-pulse {
            animation: pulse-glow 2s infinite alternate;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.3); }
            100% { box-shadow: 0 0 25px rgba(168, 85, 247, 0.4); border-color: rgba(168, 85, 247, 0.6); }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-12 selection:bg-emerald-500 selection:text-black">

    <!-- Glowing Background Lights -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[500px] h-[300px] bg-emerald-500/10 blur-[120px] pointer-events-none rounded-full"></div>
    <div class="fixed bottom-0 right-0 w-[400px] h-[300px] bg-indigo-500/10 blur-[120px] pointer-events-none rounded-full"></div>

    <!-- Header -->
    <header class="glass-card sticky top-0 z-50 border-b border-slate-800/80 px-4 py-3.5">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 text-slate-950 font-black text-lg">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                        Pocket<span class="text-emerald-400">AI</span>
                    </h1>
                    <p class="text-[10px] text-slate-400 font-medium -mt-1">Smart Financial Engine</p>
                </div>
            </div>
            
            <span class="text-[11px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-full font-semibold flex items-center gap-1.5 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                AI Active
            </span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5 relative z-10">

        <!-- Balance Overview Card -->
        <div class="glass-card-glow p-6 rounded-3xl relative overflow-hidden">
            <div class="absolute -right-6 -top-6 w-24 h-24 bg-emerald-500/10 rounded-full blur-xl pointer-events-none"></div>
            
            <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-vault text-emerald-400"></i> Net Portfolio Balance
            </p>
            <h2 id="totalBalance" class="text-4xl font-black text-white mt-2 tracking-tight">₹0</h2>
            
            <div class="grid grid-cols-2 gap-3 mt-6 pt-5 border-t border-slate-800">
                <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800 flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center text-sm shadow-inner">
                        <i class="fa-solid fa-arrow-trend-up"></i>
                    </div>
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase font-semibold">Income</p>
                        <p id="totalIncome" class="text-base font-bold text-emerald-400">₹0</p>
                    </div>
                </div>
                
                <div class="bg-slate-900/60 p-3 rounded-2xl border border-slate-800 flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-rose-500/15 text-rose-400 flex items-center justify-center text-sm shadow-inner">
                        <i class="fa-solid fa-arrow-trend-down"></i>
                    </div>
                    <div>
                        <p class="text-[10px] text-slate-400 uppercase font-semibold">Expense</p>
                        <p id="totalExpense" class="text-base font-bold text-rose-400">₹0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI Insights Box -->
        <div class="glass-card p-4 rounded-2xl border border-indigo-500/30 ai-pulse relative overflow-hidden">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xs">
                        <i class="fa-solid fa-brain"></i>
                    </div>
                    <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wider">AI Copilot Insights</h3>
                </div>
                <span class="text-[9px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-md font-mono">NEURAL v2.4</span>
            </div>
            <p id="aiAdvice" class="text-xs text-slate-300 leading-relaxed font-normal">
                Ready to analyze! Log your income or expenses below to trigger instant spending intelligence.
            </p>
        </div>

        <!-- Chart Section -->
        <div class="glass-card p-5 rounded-3xl">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Analytics Breakdown</h3>
                <span class="text-[10px] text-slate-500 font-medium">Real-time</span>
            </div>
            <div class="h-44 relative flex items-center justify-center">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="glass-card p-5 rounded-3xl">
            <h3 class="text-sm font-bold text-slate-100 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus text-emerald-400"></i> New Entry
            </h3>
            <form id="txForm" class="space-y-3.5">
                <div>
                    <input type="text" id="desc" placeholder="Transaction Note (e.g. Swiggy, Salary, Rent)" required
                        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition duration-200">
                </div>
                
                <div class="grid grid-cols-2 gap-2.5">
                    <input type="number" id="amount" placeholder="Amount (₹)" required min="1"
                        class="bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition duration-200">
                    
                    <select id="category" class="bg-slate-950/80 border border-slate-800 rounded-xl px-3 py-3 text-sm text-slate-300 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition duration-200 cursor-pointer">
                        <option value="Food">🍔 Food & Dining</option>
                        <option value="Rent">🏠 Rent & Bills</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Travel">🚗 Travel</option>
                        <option value="Income">💰 Salary / Income</option>
                        <option value="Other">📦 Other</option>
                    </select>
                </div>

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-black py-3 rounded-xl transition duration-200 text-sm shadow-lg shadow-emerald-500/20 active:scale-[0.98] flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bolt text-xs"></i> Add Transaction
                </button>
            </form>
        </div>

        <!-- Transaction History -->
        <div class="glass-card p-5 rounded-3xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-slate-400"></i> Recent Activity
                </h3>
                <button id="clearBtn" class="text-[11px] font-semibold text-rose-400 hover:text-rose-300 transition">Clear Log</button>
            </div>
            <ul id="txList" class="space-y-2.5 max-h-52 overflow-y-auto pr-1 custom-scrollbar">
                <!-- Dynamic Content -->
            </ul>
        </div>

    </main>

    <!-- Logic Script -->
    <script>
        let transactions = JSON.parse(localStorage.getItem('pocket_ai_txs')) || [];
        let chartInstance = null;

        const form = document.getElementById('txForm');
        const descInput = document.getElementById('desc');
        const amountInput = document.getElementById('amount');
        const categoryInput = document.getElementById('category');
        const txList = document.getElementById('txList');
        const totalBalanceEl = document.getElementById('totalBalance');
        const totalIncomeEl = document.getElementById('totalIncome');
        const totalExpenseEl = document.getElementById('totalExpense');
        const aiAdviceEl = document.getElementById('aiAdvice');
        const clearBtn = document.getElementById('clearBtn');

        function init() {
            updateUI();
            initChart();
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const desc = descInput.value.trim();
            const amount = parseFloat(amountInput.value);
            const category = categoryInput.value;

            if (!desc || isNaN(amount) || amount <= 0) return;

            const newTx = {
                id: Date.now(),
                desc,
                amount,
                category,
                type: category === 'Income' ? 'income' : 'expense'
            };

            transactions.push(newTx);
            saveAndRender();
            
            descInput.value = '';
            amountInput.value = '';
        });

        function deleteTx(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveAndRender();
        }

        clearBtn.addEventListener('click', () => {
            if(confirm('Clear all financial logs?')) {
                transactions = [];
                saveAndRender();
            }
        });

        function saveAndRender() {
            localStorage.setItem('pocket_ai_txs', JSON.stringify(transactions));
            updateUI();
            updateChart();
            runAIEngine();
        }

        function updateUI() {
            const income = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            const expense = transactions.filter(t => t.type === 'expense').reduce((acc, t) => acc + t.amount, 0);
            const balance = income - expense;

            totalBalanceEl.textContent = `₹${balance.toLocaleString()}`;
            totalIncomeEl.textContent = `₹${income.toLocaleString()}`;
            totalExpenseEl.textContent = `₹${expense.toLocaleString()}`;

            txList.innerHTML = '';
            if (transactions.length === 0) {
                txList.innerHTML = `<li class="text-xs text-slate-500 text-center py-6 font-medium">No activity logged yet. Add your first transaction above!</li>`;
                return;
            }

            [...transactions].reverse().forEach(tx => {
                const li = document.createElement('li');
                const isIncome = tx.type === 'income';
                li.className = 'flex justify-between items-center p-3 bg-slate-950/60 rounded-2xl border border-slate-800/80 text-xs hover:border-slate-700 transition';
                
                li.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-xl ${isIncome ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'} flex items-center justify-center text-xs">
                            <i class="fa-solid ${isIncome ? 'fa-plus' : 'fa-minus'}"></i>
                        </div>
                        <div>
                            <p class="font-bold text-slate-100">${tx.desc}</p>
                            <p class="text-[10px] text-slate-400 font-medium">${tx.category}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-black ${isIncome ? 'text-emerald-400' : 'text-slate-200'}">
                            ${isIncome ? '+' : '-'}₹${tx.amount.toLocaleString()}
                        </span>
                        <button onclick="deleteTx(${tx.id})" class="text-slate-600 hover:text-rose-400 transition p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                txList.appendChild(li);
            });
        }

        function runAIEngine() {
            if (transactions.length === 0) {
                aiAdviceEl.textContent = "Ready to analyze! Log your income or expenses below to trigger instant spending intelligence.";
                return;
            }

            const income = transactions.filter(t => t.type === 'income').reduce((acc, t) => acc + t.amount, 0);
            const expenses = transactions.filter(t => t.type === 'expense');
            const totalExpense = expenses.reduce((acc, t) => acc + t.amount, 0);

            const catTotals = {};
            expenses.forEach(t => {
                catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
            });

            let topCategory = '';
            let maxExpense = 0;
            for (const cat in catTotals) {
                if (catTotals[cat] > maxExpense) {
                    maxExpense = catTotals[cat];
                    topCategory = cat;
                }
            }

            if (totalExpense > income && income > 0) {
                aiAdviceEl.innerHTML = `<span class="text-rose-400 font-bold">⚠️ Critical Alert:</span> Deficit detected! Expenses exceed income by <b>₹${(totalExpense - income).toLocaleString()}</b>. Cut down on <b>${topCategory}</b> immediately.`;
            } else if (income > 0 && (totalExpense / income) > 0.7) {
                aiAdviceEl.innerHTML = `🔥 High Burn Rate! You spent <b>${Math.round((totalExpense/income)*100)}%</b> of total income. Major drain observed in <b>${topCategory}</b>.`;
            } else if (topCategory === 'Food' && maxExpense > 2000) {
                aiAdviceEl.innerHTML = `🍔 Food spending is spiking (₹${maxExpense.toLocaleString()}). Reducing dining out can save ~₹1,500 this month!`;
            } else if (income > 0 && totalExpense < income * 0.5) {
                aiAdviceEl.innerHTML = `⭐ Excellent Liquidity! You saved <b>>${Math.round((1 - totalExpense/income)*100)}%</b>. Recommended: Allocate surplus to investments.`;
            } else {
                aiAdviceEl.innerHTML = `⚡ Stable Cash Flow! Your budget metrics are currently optimal. Keep logging regularly.`;
            }
        }

        function initChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: getChartData(),
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 10, family: 'Plus Jakarta Sans' } } }
                    },
                    borderWidth: 0
                }
            });
        }

        function updateChart() {
            if (!chartInstance) return;
            chartInstance.data = getChartData();
            chartInstance.update();
        }

        function getChartData() {
            const expenses = transactions.filter(t => t.type === 'expense');
            const catTotals = {};

            expenses.forEach(t => {
                catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
            });

            const labels = Object.keys(catTotals);
            const data = Object.values(catTotals);

            return {
                labels: labels.length ? labels : ['No Data'],
                datasets: [{
                    data: data.length ? data : [1],
                    backgroundColor: data.length ? ['#10b981', '#6366f1', '#f59e0b', '#a855f7', '#f43f5e'] : ['#1e293b']
                }]
            };
        }

        init();
    </script>
</body>
</html>
